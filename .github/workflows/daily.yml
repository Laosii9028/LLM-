name: US market daily brief

on:
  schedule:
    # UTC 週一~週五 22:00 = 台灣 週二~週六 早上 06:00
    - cron: '0 22 * * 1-5'
  workflow_dispatch: {}   # 允許在 GitHub 網頁上手動觸發測試

permissions:
  contents: write         # 讓 workflow 能把學到的對應表 commit 回 repo

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily brief
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_ANALYSIS_MODEL: ${{ vars.GEMINI_ANALYSIS_MODEL }}
          GEMINI_LEARNED_MODEL: ${{ vars.GEMINI_LEARNED_MODEL }}
          GEMINI_ANALYSIS_FALLBACK_MODELS: ${{ vars.GEMINI_ANALYSIS_FALLBACK_MODELS }}
          GEMINI_LEARNED_FALLBACK_MODELS: ${{ vars.GEMINI_LEARNED_FALLBACK_MODELS }}
        run: python main.py

      - name: Commit learned map and brief history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add taiwan_map_learned.json briefs.json market_analysis.json taiwan_analysis.json taiwan_map.json
          git diff --staged --quiet || git commit -m "chore: daily update ($(date -u +%F))"
          git push
